# Local databases for development.
# Secrets come from dev.env (git-ignored), so start with:
#   docker compose --env-file dev.env up -d

name: user-support-db                    # fixed project name, so volume names do not depend on the folder name

services:
  qdrant:
    image: qdrant/qdrant:latest          # vector database
    container_name: qdrant
    ports:
      - "6333:6333"                      # REST API (used by the app)
      - "6334:6334"                      # gRPC (optional)
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in dev.env}
    volumes:
      - qdrant_data:/qdrant/storage      # data lives in a named volume
    restart: unless-stopped

  postgres:
    image: postgres:17                   # relational database for chat history
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"    # host port from dev.env; the container always listens on 5432
    environment:
      # Only applied when the volume is first created
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in dev.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in dev.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in dev.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
